<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Galeria de arte</title>
</head>
<body>

    <h1>Galería de Arte</h1>

    <div class="card">
        <img src="img/peristencia.jpg" alt="Dalí">
        <p class="titulo">La persistencia de la memoria</p>
        <p class="descripcion">Salvador Dalí, 1931</p>
    </div>

    <div class="card">
        <img src="img/venus.jpg" alt="Venus">
        <p class="titulo">El nacimiento de Venus</p>
        <p class="descripcion">Botticelli, 1486</p>
    </div>

    <div class="card">
        <img src="img/la-joven-de-la-perla.jpg" alt="Perla">
        <p class="titulo">La joven de la perla</p>
        <p class="descripcion">Vermeer, 1665</p>
    </div>

    <div class="card">
        <img src="img/la_ultima_cena.jpg" alt="Cena">
        <p class="titulo">La última cena</p>
        <p class="descripcion">Leonardo da Vinci, 1498</p>
    </div>

    <div class="card">
        <img src="img/la_noche_estrellada.jpg" alt="Noche">
        <p class="titulo">La noche estrellada</p>
        <p class="descripcion">Van Gogh, 1889</p>
    </div>

    <div class="card">
        <img src="img/monalisa.jpg" alt="Mona Lisa" >
        <p class="titulo">La Mona Lisa</p>
        <p class="descripcion">Leonardo da Vinci, 1503</p>
    </div>
</body>
</html>
