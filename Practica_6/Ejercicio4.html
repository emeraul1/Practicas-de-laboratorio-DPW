<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Formulario básico</title>
</head>
<body>
    
     <div class="container mt-5">

        <!-- Titulo -->
        <h2 class="text-center text-primary">Formulario de contacto</h2>

        <!-- Formulario -->
        <form class="mt-4">

            <!-- Nombre -->
            <div class="mb-3">
                <label class="form-label">Nombre</label>
                <input type="text" class="form-control" placeholder="Ingrese su nombre ejemplo: Juan Pérez" required>
            </div>

            <!-- Correo -->
            <div class="mb-3">
                <label class="form-label">Correo electrónico</label>
                <input type="email" class="form-control" placeholder="ejemplo@gmail.com" required>
            </div>

            <!-- Boton -->
            <div class="text-center">
                <button type="submit" class="btn btn-success">
                    Enviar
                </button>
            </div>

        </form>

    </div>

</body>
</html>
